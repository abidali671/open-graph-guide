<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Basic SEO -->
  <title>Page Title | Site Name</title>
  <meta name="description" content="A one- or two-sentence summary of this page." />
  <link rel="canonical" href="https://example.com/page" />
  <link rel="icon" href="https://example.com/favicon.ico" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack, Discord, Telegram) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Site Name" />
  <meta property="og:title" content="Page Title" />
  <meta property="og:description" content="A one- or two-sentence summary of this page." />
  <meta property="og:url" content="https://example.com/page" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:image" content="https://example.com/og/page-v1.jpg" />
  <meta property="og:image:secure_url" content="https://example.com/og/page-v1.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Describe what the image shows" />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@yourbrand" />
  <meta name="twitter:creator" content="@yourhandle" />
  <meta name="twitter:title" content="Page Title" />
  <meta name="twitter:description" content="A one- or two-sentence summary of this page." />
  <meta name="twitter:image" content="https://example.com/og/page-v1.jpg" />
  <meta name="twitter:image:alt" content="Describe what the image shows" />

  <!-- Verify these tags: https://www.ogscope.pk/ -->
</head>
<body>
  <h1>Page Title</h1>
</body>
</html>
